name: Build Weihnachtsuhr v4.2 ES3C28P

on:
  push:
    branches: [v42-es3c28p-final]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib update-index
          arduino-cli lib install "TJpg_Decoder"
          arduino-cli lib install "Adafruit GFX Library"

      - name: Restore v4.2 source payload
        run: |
          cat payload/part_* > /tmp/v42.b64
          base64 -d /tmp/v42.b64 | tar -xz
          mkdir -p sketch/Weihnachtsuhr_v42_ES3C28P
          cp v42_s3/include/* sketch/Weihnachtsuhr_v42_ES3C28P/
          cp v42_s3/src/*.cpp sketch/Weihnachtsuhr_v42_ES3C28P/
          echo '// Arduino build anchor' > sketch/Weihnachtsuhr_v42_ES3C28P/Weihnachtsuhr_v42_ES3C28P.ino
          ls -lh sketch/Weihnachtsuhr_v42_ES3C28P | head

      - name: Compile ESP32-S3
        run: |
          mkdir -p build
          arduino-cli compile             --fqbn "esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=huge_app"             --output-dir build             sketch/Weihnachtsuhr_v42_ES3C28P
          ls -lah build

      - name: Package BIN
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          APP="$(find build -maxdepth 1 -type f -name '*.ino.bin' | head -n1)"
          BOOT="$(find build -maxdepth 1 -type f -name '*.bootloader.bin' | head -n1)"
          PART="$(find build -maxdepth 1 -type f -name '*.partitions.bin' | head -n1)"
          MERGED="$(find build -maxdepth 1 -type f -name '*.merged.bin' | head -n1 || true)"
          cp "$APP" dist/Weihnachtsuhr_ES3C28P_v4.2_FIRMWARE.bin
          cp "$BOOT" dist/bootloader.bin
          cp "$PART" dist/partitions.bin
          if [ -n "$MERGED" ] && [ -f "$MERGED" ]; then
            cp "$MERGED" dist/Weihnachtsuhr_ES3C28P_v4.2_FULL.bin
          fi
          {
            echo "Weihnachtsuhr v4.2 - ES3C28P port"
            echo "ESP32-S3 / ILI9341V / FT6336G / ES8311 / SD_MMC"
            echo "Factory artwork embedded in firmware"
            echo "Git commit: $GITHUB_SHA"
            echo
            sha256sum dist/*.bin
          } > dist/build-info.txt
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: Weihnachtsuhr-ES3C28P-v4.2-BIN
          path: dist/
          if-no-files-found: error
          retention-days: 30

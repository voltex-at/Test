name: Build Weihnachtsuhr v4.8 ES3C28P

on:
  push:
    branches: [v42-es3c28p-final]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32-S3 core and libraries
        run: |
          set -euxo pipefail
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib update-index
          arduino-cli lib install "TJpg_Decoder"
          arduino-cli lib install "Adafruit GFX Library"
          mkdir -p "$HOME/Arduino/libraries"
          git clone --depth 1 https://github.com/schreibfaul1/ESP32-audioI2S.git "$HOME/Arduino/libraries/ESP32-audioI2S"

      - name: Restore v4.8 source and embedded artwork
        run: |
          set -euxo pipefail
          mkdir -p /tmp/v48src sketch/Weihnachtsuhr_v48_ES3C28P
          cat payload/part_* > /tmp/v48.b64
          base64 -d /tmp/v48.b64 | tar -xz -C /tmp/v48src
          cp /tmp/v48src/include/* sketch/Weihnachtsuhr_v48_ES3C28P/
          cp /tmp/v48src/src/*.cpp sketch/Weihnachtsuhr_v48_ES3C28P/
          python3 - <<'PY'
          from pathlib import Path
          p=Path("sketch/Weihnachtsuhr_v48_ES3C28P/Touch.h")
          s=p.read_text()
          s=s.replace('pinMode(RST,OUTPUT);pinMode(IRQ,INPUT_PULLUP);digitalWrite(RST,LOW);delay(10);digitalWrite(RST,HIGH);delay(250);\n  Wire.begin(SDA_PIN,SCL_PIN);Wire.setClock(400000);',
                      'Wire.begin(SDA_PIN,SCL_PIN);Wire.setClock(400000);\n  pinMode(RST,OUTPUT);pinMode(IRQ,INPUT);digitalWrite(RST,LOW);delay(12);digitalWrite(RST,HIGH);delay(320);')
          p.write_text(s)
          p=Path("sketch/Weihnachtsuhr_v48_ES3C28P/main.cpp")
          s=p.read_text()
          old='''void pollTouch() {\n  uint32_t now=millis();if(now-lastTouch<25)return;lastTouch=now;\n  if(digitalRead(touch::IRQ)){touchHeld=false;return;}if(touchHeld)return;\n  touch::Point p;if(!touch::raw(p))return;touchHeld=true;'''
          new='''void pollTouch() {\n  uint32_t now=millis();if(now-lastTouch<25)return;lastTouch=now;\n  // FT6336G is polled over I2C. Do not gate reads on INT: some ES3C28P\n  // revisions keep INT high unless the controller is explicitly configured.\n  touch::Point p;\n  if(!touch::raw(p)){touchHeld=false;return;}\n  if(touchHeld)return;\n  touchHeld=true;'''
          if old not in s: raise SystemExit("pollTouch pattern not found")
          s=s.replace(old,new)
          old_cfg='''  screen::text(lcd,"Wi-Fi",190,80,&FreeSerifBold9pt7b,screen::CREAM,156);\n  lcd.setTextDatum(MC_DATUM);lcd.setTextColor(screen::CREAM);\n  lcd.drawString(apName,190,101,2);\n  screen::text(lcd,tr("Passwort","Haslo","Password"),190,120,&FreeSerif9pt7b,screen::CREAM,156);\n  screen::text(lcd,adminPassword,190,140,&FreeSans9pt7b,screen::CREAM,156);\n  screen::text(lcd,"192.168.4.1",190,160,&FreeSans9pt7b,screen::CREAM,156);'''
          new_cfg='''  screen::text(lcd,"Wi-Fi",190,76,&FreeSerifBold9pt7b,screen::CREAM,148);\n  screen::text(lcd,apName,190,101,&FreeSans9pt7b,screen::CREAM,150);\n  screen::text(lcd,tr("Passwort","Haslo","Password"),190,122,&FreeSerif9pt7b,screen::CREAM,148);\n  screen::text(lcd,adminPassword,190,143,&FreeSans9pt7b,screen::CREAM,150);\n  screen::text(lcd,"192.168.4.1",190,164,&FreeSans9pt7b,screen::CREAM,150);'''
          if old_cfg not in s: raise SystemExit("drawConfig pattern not found")
          s=s.replace(old_cfg,new_cfg)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path("sketch/Weihnachtsuhr_v48_ES3C28P/main.cpp")
          s=p.read_text()
          pairs=[
            ("","","touch-test-ui"),
            ("","","modern-player-ui"),
            ("","","touch-test-logic"),
          ]
          for a,b,name in pairs:
            old=base64.b64decode(a).decode(); new=base64.b64decode(b).decode()
            if old not in s: raise SystemExit(name+" pattern not found")
            s=s.replace(old,new)
          p.write_text(s)
          PY
          sed -i 's/FreeSansBold9pt7b/FreeSans9pt7b/g' sketch/Weihnachtsuhr_v48_ES3C28P/main.cpp
          echo '' | base64 -d | python3
          python3 scripts/v47_patch.py
          python3 scripts/v48_patch.py
          echo '// Arduino build anchor' > sketch/Weihnachtsuhr_v48_ES3C28P/Weihnachtsuhr_v48_ES3C28P.ino
          cat > sketch/Weihnachtsuhr_v48_ES3C28P/partitions.csv <<'EOF'
          # Name,   Type, SubType, Offset,   Size,     Flags
          nvs,      data, nvs,     0x9000,   0x5000,
          otadata,  data, ota,     0xe000,   0x2000,
          app0,     app,  ota_0,   0x10000,  0x600000,
          app1,     app,  ota_1,   0x610000, 0x600000,
          spiffs,   data, spiffs,  0xC10000, 0x3E0000,
          EOF
          grep -R "grincz" -n sketch/Weihnachtsuhr_v48_ES3C28P | head || true
          ls -lh sketch/Weihnachtsuhr_v48_ES3C28P | head -40

      - name: Compile ESP32-S3 16MB / 8MB PSRAM
        run: |
          set -euxo pipefail
          mkdir -p build
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=huge_app" \
            --build-property upload.maximum_size=6291456 \
            --output-dir build \
            sketch/Weihnachtsuhr_v48_ES3C28P
          ls -lah build

      - name: Package BIN
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          APP="$(find build -maxdepth 1 -type f -name '*.ino.bin' | head -n1)"
          BOOT="$(find build -maxdepth 1 -type f -name '*.bootloader.bin' | head -n1)"
          PART="$(find build -maxdepth 1 -type f -name '*.partitions.bin' | head -n1)"
          MERGED="$(find build -maxdepth 1 -type f -name '*.merged.bin' | head -n1 || true)"
          cp "$APP" dist/Weihnachtsuhr_ES3C28P_v4.8_FIRMWARE.bin
          cp "$BOOT" dist/bootloader.bin
          cp "$PART" dist/partitions.bin
          if [ -n "$MERGED" ] && [ -f "$MERGED" ]; then
            cp "$MERGED" dist/Weihnachtsuhr_ES3C28P_v4.8_FULL.bin
          fi
          {
            echo "Weihnachtsuhr v4.8 - ES3C28P"
            echo "ESP32-S3 / ILI9341V / FT6336G / ES8311 / SD_MMC"
            echo "Factory artwork embedded in firmware, including Grincz"
            echo "User images and music on SD; MP3/WAV/AAC/M4A/FLAC player and web upload"
            echo "Git commit: $GITHUB_SHA"
            echo
            sha256sum dist/*.bin
          } > dist/build-info.txt
          ls -lh dist

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: Weihnachtsuhr-ES3C28P-v4.8-BIN
          path: dist/
          if-no-files-found: error
          retention-days: 30

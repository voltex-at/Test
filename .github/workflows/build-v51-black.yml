name: Build Peppi v5 LVGL from user v4.6 ES3C28P

on:
  push:
    branches: [v5-user-src-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32-S3 core and libraries
        run: |
          set -euxo pipefail
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib update-index
          arduino-cli lib install "TJpg_Decoder"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "lvgl@9.3.0"
          mkdir -p "$HOME/Arduino/libraries"
          git clone --depth 1 https://github.com/schreibfaul1/ESP32-audioI2S.git "$HOME/Arduino/libraries/ESP32-audioI2S"

      - name: Restore base and apply exact user-v4.6 LVGL source
        run: |
          set -euxo pipefail
          mkdir -p /tmp/v51src sketch/Weihnachtsuhr_v51_ES3C28P
          cat payload/part_* > /tmp/v51.b64
          base64 -d /tmp/v51.b64 | tar -xz -C /tmp/v51src
          cp /tmp/v51src/include/* sketch/Weihnachtsuhr_v51_ES3C28P/
          cp /tmp/v51src/src/*.cpp sketch/Weihnachtsuhr_v51_ES3C28P/
          # Black ES3C28P build: do not run any legacy touch/calibration rewrites here.
          # The board-specific FT6336G driver and calibration removal are applied once,
          # deterministically, by scripts/v51_black_patch.py.
          sed -i 's/FreeSansBold9pt7b/FreeSans9pt7b/g' sketch/Weihnachtsuhr_v51_ES3C28P/main.cpp
          python3 scripts/v47_patch.py
          python3 scripts/v48_patch.py
          python3 scripts/v50_patch.py
          python3 scripts/v51_black_patch.py

          # Transform the known-good black-board base exactly into the LVGL
          # source generated from the user's uploaded v4.6 ArduinoIDE project.
          cat v5userpatchgz/p00_0 v5userpatchgz/p00_1 v5userpatchgz/p00_2 v5userpatchgz/part_01 v5userpatchgz/part_02 > /tmp/userpatch.gz.b64
          base64 -d /tmp/userpatch.gz.b64 > /tmp/userpatch.gz
          gzip -dc /tmp/userpatch.gz > /tmp/user.patch
          (
            cd sketch/Weihnachtsuhr_v51_ES3C28P
            patch -p1 --forward --batch < /tmp/user.patch
          )
          cp v5userpatch/FactoryAssets.h sketch/Weihnachtsuhr_v51_ES3C28P/FactoryAssets.h
          echo '// Arduino build anchor' > sketch/Weihnachtsuhr_v51_ES3C28P/Weihnachtsuhr_v51_ES3C28P.ino

          # Guards: FT6336G only, no touch calibration, LVGL present.
          grep -q 'FT6336G' sketch/Weihnachtsuhr_v51_ES3C28P/Touch.h
          ! grep -RqE 'startCalibration|drawCalibration|touch::Calibration|/api/calibrate|calibrationRaw|calibrationReady' sketch/Weihnachtsuhr_v51_ES3C28P/main.cpp sketch/Weihnachtsuhr_v51_ES3C28P/Touch.h || exit 1
          grep -q '#include <lvgl.h>' sketch/Weihnachtsuhr_v51_ES3C28P/main.cpp
          cat > sketch/Weihnachtsuhr_v51_ES3C28P/partitions.csv <<'EOF'
          # Name,   Type, SubType, Offset,   Size,     Flags
          nvs,      data, nvs,     0x9000,   0x5000,
          otadata,  data, ota,     0xe000,   0x2000,
          app0,     app,  ota_0,   0x10000,  0x600000,
          app1,     app,  ota_1,   0x610000, 0x600000,
          spiffs,   data, spiffs,  0xC10000, 0x3E0000,
          EOF
          grep -R "grincz" -n sketch/Weihnachtsuhr_v51_ES3C28P | head || true
          ls -lh sketch/Weihnachtsuhr_v51_ES3C28P | head -40

      - name: Compile ESP32-S3 16MB / 8MB PSRAM
        run: |
          set -euxo pipefail
          mkdir -p build
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=huge_app" \
            --build-property upload.maximum_size=6291456 \
            --build-property compiler.cpp.extra_flags="-DLV_CONF_INCLUDE_SIMPLE=1" \
            --build-property compiler.c.extra_flags="-DLV_CONF_INCLUDE_SIMPLE=1" \
            --output-dir build \
            sketch/Weihnachtsuhr_v51_ES3C28P
          ls -lah build

      - name: Package BIN
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          APP="$(find build -maxdepth 1 -type f -name '*.ino.bin' | head -n1)"
          BOOT="$(find build -maxdepth 1 -type f -name '*.bootloader.bin' | head -n1)"
          PART="$(find build -maxdepth 1 -type f -name '*.partitions.bin' | head -n1)"
          MERGED="$(find build -maxdepth 1 -type f -name '*.merged.bin' | head -n1 || true)"
          cp "$APP" dist/Peppi_v5_LVGL_BLACK_ES3C28P_FIRMWARE.bin
          cp "$BOOT" dist/bootloader.bin
          cp "$PART" dist/partitions.bin
          if [ -n "$MERGED" ] && [ -f "$MERGED" ]; then
            cp "$MERGED" dist/Peppi_v5_LVGL_BLACK_ES3C28P_FULL.bin
          fi
          {
            echo "Peppi v5 LVGL - migrated from user-provided v4.6 ArduinoIDE source"
            echo "BLACK ES3C28P ONLY / ESP32-S3 / ILI9341V / FT6336G / ES8311 / SD_MMC"
            echo "Hardware/backend preserved from user v4.6 source; UI migrated to LVGL 9.3"
            echo "LVGL 9.3 UI / FT6336G absolute touch / NO CALIBRATION / user photos and music on SD"
            echo "Git commit: $GITHUB_SHA"
            echo
            sha256sum dist/*.bin
          } > dist/build-info.txt
          zip -qr dist/Peppi_v5_LVGL_BLACK_ES3C28P_SOURCE.zip sketch/Weihnachtsuhr_v51_ES3C28P
          ls -lh dist

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: Peppi-v5-LVGL-BLACK-ES3C28P-from-v4.6
          path: dist/
          if-no-files-found: error
          retention-days: 30

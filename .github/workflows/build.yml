name: Build CYD Audio Diagnostic BIN

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e cyd_st7789_diag

      - name: Prepare BIN files
        shell: bash
        run: |
          set -euxo pipefail
          ENV_DIR=".pio/build/cyd_st7789_diag"
          mkdir -p dist
          cp "$ENV_DIR/firmware.bin" dist/Weihnachtsuhr_AUDIO_TEST_update.bin
          cp "$ENV_DIR/bootloader.bin" dist/bootloader.bin
          cp "$ENV_DIR/partitions.bin" dist/partitions.bin
          BOOT_APP0="$(find ~/.platformio/packages -type f -name boot_app0.bin | head -n 1)"
          cp "$BOOT_APP0" dist/boot_app0.bin
          ESPTOOL="$(find ~/.platformio/packages -type f -name esptool.py | head -n 1)"
          python "$ESPTOOL" --chip esp32 merge_bin -o dist/Weihnachtsuhr_AUDIO_TEST_full.bin             --flash_mode dio --flash_freq 40m --flash_size 4MB             0x1000 dist/bootloader.bin             0x8000 dist/partitions.bin             0xe000 dist/boot_app0.bin             0x10000 dist/Weihnachtsuhr_AUDIO_TEST_update.bin
          {
            echo "Firmware: CYD audio diagnostic"
            echo "Board: ESP32-2432S028 / ST7789"
            echo "Backlight GPIO21: constant HIGH, PWM disabled"
            echo "Audio DAC GPIO26: 128 idle"
            echo "WiFi / SD / touch: disabled"
            echo "Git commit: $GITHUB_SHA"
            echo
            sha256sum dist/*.bin
          } > dist/build-info.txt
          ls -lh dist

      - name: Upload compiled binaries
        uses: actions/upload-artifact@v4
        with:
          name: Weihnachtsuhr-AUDIO-TEST-BIN
          path: dist/
          if-no-files-found: error
          retention-days: 30

name: Build Weihnachtsuhr ES3C28P v3 RAW FSPI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib update-index
          arduino-cli lib install "TJpg_Decoder"
          arduino-cli lib install "Adafruit GFX Library"

      - name: Prepare Arduino sketch
        run: |
          mkdir -p sketch/Weihnachtsuhr_ES3C28P
          cp include/*.h sketch/Weihnachtsuhr_ES3C28P/
          cp src/*.cpp sketch/Weihnachtsuhr_ES3C28P/
          echo '// Arduino build anchor' > sketch/Weihnachtsuhr_ES3C28P/Weihnachtsuhr_ES3C28P.ino

      - name: Compile
        run: |
          mkdir -p build
          arduino-cli compile --fqbn esp32:esp32:esp32s3 --output-dir build sketch/Weihnachtsuhr_ES3C28P
          ls -lah build

      - name: Prepare BIN package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          APP="$(find build -maxdepth 1 -type f -name '*.ino.bin' | head -n1)"
          BOOT="$(find build -maxdepth 1 -type f -name '*.bootloader.bin' | head -n1)"
          PART="$(find build -maxdepth 1 -type f -name '*.partitions.bin' | head -n1)"
          MERGED="$(find build -maxdepth 1 -type f -name '*.merged.bin' | head -n1 || true)"
          cp "$APP" dist/Weihnachtsuhr_ES3C28P_v3.0_FIRMWARE.bin
          cp "$BOOT" dist/bootloader.bin
          cp "$PART" dist/partitions.bin
          if [ -n "$MERGED" ] && [ -f "$MERGED" ]; then
            cp "$MERGED" dist/Weihnachtsuhr_ES3C28P_v3.0_FULL.bin
          fi
          {
            echo "Project: Weihnachtsuhr ES3C28P v3.0"
            echo "Display: RAW FSPI driver, exact known-working ILI9341V init"
            echo "Board: ES3C28P / ESP32-S3 / ILI9341V / FT6336G / ES8311"
            echo "Arduino-ESP32: 3.3.2"
            echo "Git commit: $GITHUB_SHA"
            echo
            sha256sum dist/*.bin
          } > dist/build-info.txt
          ls -lh dist

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: Weihnachtsuhr-ES3C28P-v3-BIN
          path: dist/
          if-no-files-found: error
          retention-days: 30

name: Build Weihnachtsuhr ES3C28P v2

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib update-index
          arduino-cli lib install "TFT_eSPI@2.5.43"
          arduino-cli lib install "TJpg_Decoder@1.1.0"

      - name: Configure TFT_eSPI for ES3C28P
        shell: bash
        run: |
          LIBDIR="$(arduino-cli config get directories.user)/libraries/TFT_eSPI"
          cat > "$LIBDIR/User_Setup.h" <<'EOF'
          #define USER_SETUP_INFO "ES3C28P"
          #define ILI9341_DRIVER
          #define TFT_WIDTH 240
          #define TFT_HEIGHT 320
          #define TFT_MISO 13
          #define TFT_MOSI 11
          #define TFT_SCLK 12
          #define TFT_CS   10
          #define TFT_DC   46
          #define TFT_RST  -1
          #define TFT_BL   45
          #define TFT_BACKLIGHT_ON HIGH
          #define LOAD_GLCD
          #define LOAD_FONT2
          #define LOAD_FONT4
          #define LOAD_FONT6
          #define LOAD_FONT7
          #define LOAD_FONT8
          #define LOAD_GFXFF
          #define SMOOTH_FONT
          #define SPI_FREQUENCY 40000000
          #define SPI_READ_FREQUENCY 20000000
          EOF

      - name: Prepare Arduino sketch
        shell: bash
        run: |
          mkdir -p sketch/Weihnachtsuhr_ES3C28P
          cp include/*.h sketch/Weihnachtsuhr_ES3C28P/
          cp src/*.cpp sketch/Weihnachtsuhr_ES3C28P/
          echo '// Arduino build anchor' > sketch/Weihnachtsuhr_ES3C28P/Weihnachtsuhr_ES3C28P.ino

      - name: Compile
        run: |
          mkdir -p build
          arduino-cli compile             --fqbn esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi             --output-dir build             sketch/Weihnachtsuhr_ES3C28P
          ls -lah build

      - name: Prepare BIN package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          APP="$(find build -maxdepth 1 -type f -name '*.ino.bin' | head -n1)"
          BOOT="$(find build -maxdepth 1 -type f -name '*.bootloader.bin' | head -n1)"
          PART="$(find build -maxdepth 1 -type f -name '*.partitions.bin' | head -n1)"
          MERGED="$(find build -maxdepth 1 -type f -name '*.merged.bin' | head -n1 || true)"
          cp "$APP" dist/Weihnachtsuhr_ES3C28P_v2.0_FIRMWARE.bin
          cp "$BOOT" dist/bootloader.bin
          cp "$PART" dist/partitions.bin
          if [ -n "$MERGED" ] && [ -f "$MERGED" ]; then
            cp "$MERGED" dist/Weihnachtsuhr_ES3C28P_v2.0_FULL.bin
          fi
          {
            echo "Project: Weihnachtsuhr ES3C28P v2.0"
            echo "Board: ES3C28P / ESP32-S3 / ILI9341V / FT6336G / ES8311"
            echo "Arduino-ESP32: 3.3.2"
            echo "Flash: 16MB"
            echo "PSRAM: OPI"
            echo "Git commit: $GITHUB_SHA"
            echo
            sha256sum dist/*.bin
          } > dist/build-info.txt
          ls -lh dist

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: Weihnachtsuhr-ES3C28P-v2-BIN
          path: dist/
          if-no-files-found: error
          retention-days: 30

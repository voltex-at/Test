name: Build Weihnachtsuhr ES3C28P BIN

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core 3.3.2
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Restore firmware source
        run: |
          mkdir -p firmware_es3c28p/firmware_es3c28p
          base64 -d firmware_es3c28p/main.cpp.gz.b64 | gzip -d > firmware_es3c28p/firmware_es3c28p/firmware_es3c28p.ino
          wc -l firmware_es3c28p/firmware_es3c28p/firmware_es3c28p.ino

      - name: Compile ESP32-S3 firmware
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3 \
            --output-dir build \
            firmware_es3c28p/firmware_es3c28p
          ls -lah build

      - name: Prepare BIN files
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          APP="$(find build -maxdepth 1 -type f -name '*.ino.bin' | head -n1)"
          BOOT="$(find build -maxdepth 1 -type f -name '*.bootloader.bin' | head -n1)"
          PART="$(find build -maxdepth 1 -type f -name '*.partitions.bin' | head -n1)"
          MERGED="$(find build -maxdepth 1 -type f -name '*.merged.bin' | head -n1 || true)"
          cp "$APP" dist/Weihnachtsuhr_ES3C28P_v1.0_firmware.bin
          cp "$BOOT" dist/bootloader.bin
          cp "$PART" dist/partitions.bin
          if [ -n "$MERGED" ] && [ -f "$MERGED" ]; then
            cp "$MERGED" dist/Weihnachtsuhr_ES3C28P_v1.0_full_flash.bin
          fi
          {
            echo "Project: Weihnachtsuhr ES3C28P v1.0"
            echo "Board: ESP32-S3 / ES3C28P"
            echo "Arduino-ESP32: 3.3.2"
            echo "FQBN: esp32:esp32:esp32s3"
            echo "Git commit: $GITHUB_SHA"
            echo
            sha256sum dist/*.bin
          } > dist/build-info.txt
          ls -lh dist

      - name: Upload compiled binaries
        uses: actions/upload-artifact@v4
        with:
          name: Weihnachtsuhr-ES3C28P-BIN
          path: dist/
          if-no-files-found: error
          retention-days: 30
